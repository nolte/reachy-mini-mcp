name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: lint / test / docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          # Pinned to the latest stable Task release because
          # arduino/setup-task's `3.x` resolution currently picks a
          # non-existent v3.51.0 tag and aborts with HTTP 404. Track the
          # upstream lookup; bump deliberately via Renovate.
          version: 3.50.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install project dependencies
        run: task install

      - name: Run lint
        run: task lint

      - name: Run tests
        run: task test

      - name: Build docs
        run: task docs
