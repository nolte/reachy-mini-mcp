name: Docker Lint & Build

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_build:
    uses: nolte/gh-plumbing/.github/workflows/reusable-docker-lint-build.yaml@v2.1.0
    with:
      context: "."
      dockerfile: Dockerfile
      platforms: linux/amd64
