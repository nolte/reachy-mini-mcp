name: Release Deliver Docker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: nolte/gh-plumbing/.github/workflows/reusable-docker-publish.yaml@v1.1.17
    with:
      image_name: reachy-mini-mcp
      context: "."
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
