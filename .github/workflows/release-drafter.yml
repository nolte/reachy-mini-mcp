  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-drafter.yml@v2.1.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
