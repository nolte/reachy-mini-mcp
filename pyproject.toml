[project]
name = "reachy-mini-mcp"
version = "0.0.1"
description = "Model Context Protocol server for Reachy Mini — REST wrapper around the Pollen daemon."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "nolte", email = "nolte07@gmail.com" },
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_mini_mcp"]

[tool.uv]
